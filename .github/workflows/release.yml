name: Release

# Pushing a tag `vX.Y.Z` that matches package.json's version builds the
# standalone binaries, creates the GitHub release with notes taken from
# CHANGELOG.md, publishes to npm (trusted publishing, no token) and bumps
# the Homebrew tap. The three publish steps are separate jobs so one
# failing channel never blocks the others.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build and create GitHub release
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check the tag matches package.json
        id: version
        run: |
          version="$(jq -r .version package.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, test
        run: |
          bun run check
          bun run typecheck
          bun test

      - name: Build release archives
        run: scripts/build-release.sh

      - name: Assemble release notes
        run: scripts/release-notes.sh "${{ steps.version.outputs.version }}" dist/checksums.txt > dist/notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/notes.md \
            "dist/of-darwin-arm64.tar.gz#of-darwin-arm64.tar.gz (Apple Silicon)" \
            "dist/of-darwin-x64.tar.gz#of-darwin-x64.tar.gz (Intel)" \
            dist/checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - run: npm publish

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist

      - name: Skip when HOMEBREW_TAP_TOKEN is not configured
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN secret not set; Formula/omnifocus-cli.rb in maxboettinger/homebrew-tap was not updated"

      - name: Commit the new formula to the tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/maxboettinger/homebrew-tap.git" tap
          scripts/homebrew-formula.sh "${VERSION}" dist/checksums.txt > tap/Formula/omnifocus-cli.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/omnifocus-cli.rb
          git commit -m "omnifocus-cli ${VERSION}"
          git push
